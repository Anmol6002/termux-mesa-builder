name: Build Universal Natron ARM64 (All Linux OS)

on:
  workflow_dispatch: # Manual trigger from phone or browser

permissions:
  contents: write

jobs:
  build-universal-arm64:
    name: Build Universal Portable Tarball (ARM64)
    runs-on: ubuntu-24.04-arm # Native ARM64 Hardware

    steps:
      - name: Checkout Repositories
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/Natron'
          submodules: 'recursive'
          fetch-depth: 1
          path: 'natron-core'

      - name: Checkout OpenFX-IO
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/openfx-io'
          submodules: 'recursive'
          fetch-depth: 1
          path: 'openfx-io'

      - name: Checkout OpenFX-Misc
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/openfx-misc'
          submodules: 'recursive'
          fetch-depth: 1
          path: 'openfx-misc'

      - name: Checkout Community PyPlugs
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/natron-plugins'
          path: 'community-pyplugs'

      # ====================================================
      # BUILD INSIDE UBUNTU 20.04 ARM64 CONTAINER (GLIBC 2.31)
      # ====================================================
      - name: Compile Natron & Plugins in Ubuntu 20.04 Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:20.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # 1. Install Build Dependencies
            apt-get update && apt-get install -y \
              git cmake build-essential tar rsync \
              libx11-dev libxext-dev libgl1-mesa-dev libglew-dev \
              qtbase5-dev qtmultimedia5-dev libqt5svg5-dev \
              libboost-all-dev libcairo2-dev libpixman-1-dev libpango1.0-dev \
              libopencolorio-dev libopenimageio-dev expat libexpat1-dev fontconfig libfontconfig1-dev \
              libswscale-dev libavcodec-dev libavformat-dev libavutil-dev \
              libglog-dev libceres-dev libraw-dev libopenexr-dev \
              python3-dev python3-pyside2.qtcore python3-pyside2.qtgui python3-pyside2.widgets

            # 2. Build Natron Engine
            cd /workspace/natron-core
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release -DAUDIO=ON -DRICHTEXT=ON -DBUNDLE_FONTS_CONF=ON ..
            cmake --build . --parallel \$(nproc)

            # 3. Build OpenFX-IO
            cd /workspace/openfx-io
            make CONFIG=release -j\$(nproc) || true

            # 4. Build OpenFX-Misc
            cd /workspace/openfx-misc
            make CONFIG=release -j\$(nproc) || true
          "

      # ====================================================
      # BUNDLE DEPENDENCIES & CREATE UNIVERSAL TARBALL
      # ====================================================
      - name: Package Standalone Universal Tarball
        run: |
          PKG_NAME="Natron-2.6.0-Universal-Linux-arm64"
          mkdir -p ${PKG_NAME}/bin
          mkdir -p ${PKG_NAME}/lib
          mkdir -p ${PKG_NAME}/Plugins/OFX/Natron
          mkdir -p ${PKG_NAME}/Plugins/PyPlugs

          # 1. Copy Executables
          cp natron-core/build/Natron* ${PKG_NAME}/bin/ 2>/dev/null || true

          # 2. Copy OpenFX Plugins
          find openfx-io -name "*.ofx.bundle" -exec cp -r {} ${PKG_NAME}/Plugins/OFX/Natron/ \;
          find openfx-misc -name "*.ofx.bundle" -exec cp -r {} ${PKG_NAME}/Plugins/OFX/Natron/ \;

          # 3. Copy Community PyPlugs
          rsync -av --exclude='.git*' community-pyplugs/ ${PKG_NAME}/Plugins/PyPlugs/

          # 4. Auto-Bundle Dynamic Shared Libraries (.so)
          echo "Gathering dynamic dependencies..."
          # Find all binaries and compiled .ofx plugins
          TARGETS=$(find ${PKG_NAME} -type f \( -name "Natron*" -o -name "*.ofx" \))

          for target in $TARGETS; do
            ldd "$target" 2>/dev/null | grep "=>" | awk '{print $3}' | grep -v "^$" | while read -r lib; do
              # Exclude core system/graphics libraries that host GPU drivers must provide
              if [ -f "$lib" ]; then
                case "$lib" in
                  *libc.so*|*libpthread.so*|*libdl.so*|*libm.so*|*librt.so*|*libGL.so*|*libEGL.so*|*libdrm.so*|*libgbm.so*|*libX11.so*)
                    ;; # Skip host-level libraries
                  *)
                    cp -L -n "$lib" ${PKG_NAME}/lib/ 2>/dev/null || true
                    ;;
                esac
              fi
            done
          done

          # 5. Create Standalone Launcher Script
          cat << 'EOF' > ${PKG_NAME}/run-natron.sh
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${SCRIPT_DIR}/bin:${LD_LIBRARY_PATH}"
          export OFX_PLUGIN_PATH="${SCRIPT_DIR}/Plugins/OFX/Natron:${OFX_PLUGIN_PATH}"
          export NATRON_PLUGIN_PATH="${SCRIPT_DIR}/Plugins/PyPlugs:${NATRON_PLUGIN_PATH}"
          exec "${SCRIPT_DIR}/bin/Natron" "$@"
          EOF

          chmod +x ${PKG_NAME}/run-natron.sh
          chmod +x ${PKG_NAME}/bin/Natron* 2>/dev/null || true

          # 6. Compress into Tarball
          tar -czvf ${PKG_NAME}.tar.gz ${PKG_NAME}

      # ====================================================
      # RELEASE ASSET TO GITHUB
      # ====================================================
      - name: Upload Universal Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-arm64-universal
          name: "Natron 2.6.0 Universal Linux ARM64"
          body: |
            ### Standalone Universal ARM64 Linux Package
            
            This release is **distro-agnostic**. It bundles Qt5, FFmpeg, Boost, Python, OpenColorIO, and OpenFX plugins so it runs on almost any ARM64 Linux distro without installing system packages.

            #### Tested Compatibility:
            - Ubuntu 20.04 / 22.04 / 24.04+
            - Debian 11 / 12 / 13+
            - Raspberry Pi OS (64-bit)
            - Fedora, Arch Linux, Manjaro ARM, Asahi Linux

            #### Usage:
            ```bash
            tar -xzvf Natron-2.6.0-Universal-Linux-arm64.tar.gz
            cd Natron-2.6.0-Universal-Linux-arm64
            ./run-natron.sh
            ```
          draft: true
          files: Natron-2.6.0-Universal-Linux-arm64.tar.gz
