name: Build Universal Natron ARM64 (All Linux OS)

on:
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-universal-arm64:
    name: Build Universal Portable Tarball (ARM64)
    runs-on: ubuntu-24.04-arm # Native ARM64 Hardware

    steps:
      # ====================================================
      # 1. CHECKOUT REPOSITORIES (WITH SUBMODULES)
      # ====================================================
      - name: Checkout Natron Core
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/Natron'
          submodules: 'recursive'
          fetch-depth: 1
          path: 'natron-core'

      - name: Checkout OpenFX-IO
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/openfx-io'
          submodules: 'recursive'
          fetch-depth: 1
          path: 'openfx-io'

      - name: Checkout OpenFX-Misc
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/openfx-misc'
          submodules: 'recursive'
          fetch-depth: 1
          path: 'openfx-misc'

      - name: Checkout Community PyPlugs
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/natron-plugins'
          path: 'community-pyplugs'

      # ====================================================
      # 2. BUILD EVERYTHING INSIDE UBUNTU 22.04 CONTAINER (Qt 5.15)
      # ====================================================
      - name: Compile Natron & OpenFX Plugins in Ubuntu 22.04
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:22.04 bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive

            # A. Update APT & Install Ubuntu 22.04 Packages (Includes Qt 5.15 & CMake 3.22)
            apt-get update && apt-get install -y \
              git cmake build-essential pkg-config tar rsync \
              libx11-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev libglew-dev libegl1-mesa-dev \
              qtbase5-dev qtmultimedia5-dev libqt5svg5-dev qttools5-dev qttools5-dev-tools \
              libqt5opengl5-dev libqt5xmlpatterns5-dev \
              libboost-all-dev libcairo2-dev libpixman-1-dev libpango1.0-dev \
              libopencolorio-dev libopenimageio-dev expat libexpat1-dev fontconfig libfontconfig1-dev \
              libswscale-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libsox-dev \
              libglog-dev libceres-dev libraw-dev libopenexr-dev libpng-dev libjpeg-dev libtiff-dev \
              libseccomp-dev libunwind-dev libxml2-dev \
              python3-dev python3-pyside2.qtcore python3-pyside2.qtgui python3-pyside2.qtwidgets \
              python3-pyside2.qtsvg python3-pyside2.qtxml libpyside2-dev shiboken2 libshiboken2-dev

            # B. Build Natron Engine
            echo '=== Building Natron Core Engine ==='
            cd /workspace/natron-core
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DAUDIO=ON \
                  -DRICHTEXT=ON \
                  -DBUNDLE_FONTS_CONF=ON ..
            cmake --build . --parallel \$(nproc)

            # C. Build OpenFX-IO Plugins
            echo '=== Building OpenFX-IO Plugins ==='
            cd /workspace/openfx-io
            if [ -f "CMakeLists.txt" ]; then
              mkdir -p build && cd build
              cmake -DCMAKE_BUILD_TYPE=Release ..
              cmake --build . --parallel \$(nproc)
            else
              make CONFIG=release -j\$(nproc)
            fi

            # D. Build OpenFX-Misc Plugins
            echo '=== Building OpenFX-Misc Plugins ==='
            cd /workspace/openfx-misc
            if [ -f "CMakeLists.txt" ]; then
              mkdir -p build && cd build
              cmake -DCMAKE_BUILD_TYPE=Release ..
              cmake --build . --parallel \$(nproc)
            else
              make CONFIG=release -j\$(nproc)
            fi
          "

      # ====================================================
      # 3. HARVEST DEPENDENCIES & PACKAGE TARBALL
      # ====================================================
      - name: Package Standalone Universal Tarball
        run: |
          PKG_NAME="Natron-2.6.0-Universal-Linux-arm64"
          mkdir -p ${PKG_NAME}/bin
          mkdir -p ${PKG_NAME}/lib
          mkdir -p ${PKG_NAME}/Plugins/OFX/Natron
          mkdir -p ${PKG_NAME}/Plugins/PyPlugs

          # A. Copy Executables
          cp natron-core/build/Natron* ${PKG_NAME}/bin/ 2>/dev/null || true

          # B. Copy OpenFX Plugin Bundles
          find openfx-io -name "*.ofx.bundle" -exec cp -r {} ${PKG_NAME}/Plugins/OFX/Natron/ \;
          find openfx-misc -name "*.ofx.bundle" -exec cp -r {} ${PKG_NAME}/Plugins/OFX/Natron/ \;

          # C. Copy Community PyPlugs
          rsync -av --exclude='.git*' community-pyplugs/ ${PKG_NAME}/Plugins/PyPlugs/

          # D. Auto-Bundle Dynamic Shared Libraries (.so)
          echo "Gathering dynamic dependencies via ldd..."
          TARGETS=$(find ${PKG_NAME} -type f \( -name "Natron*" -o -name "*.ofx" \))

          for target in $TARGETS; do
            ldd "$target" 2>/dev/null | grep "=>" | awk '{print $3}' | grep -v "^$" | while read -r lib; do
              if [ -f "$lib" ]; then
                case "$lib" in
                  *libc.so*|*libpthread.so*|*libdl.so*|*libm.so*|*librt.so*|*libGL.so*|*libEGL.so*|*libdrm.so*|*libgbm.so*|*libX11.so*|*libxcb.so*)
                    ;; # Exclude host GPU drivers & glibc
                  *)
                    cp -L -n "$lib" ${PKG_NAME}/lib/ 2>/dev/null || true
                    ;;
                esac
              fi
            done
          done

          # E. Create Launcher Script
          cat << 'EOF' > ${PKG_NAME}/run-natron.sh
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${SCRIPT_DIR}/lib:${SCRIPT_DIR}/bin:${LD_LIBRARY_PATH}"
          export OFX_PLUGIN_PATH="${SCRIPT_DIR}/Plugins/OFX/Natron:${OFX_PLUGIN_PATH}"
          export NATRON_PLUGIN_PATH="${SCRIPT_DIR}/Plugins/PyPlugs:${NATRON_PLUGIN_PATH}"
          exec "${SCRIPT_DIR}/bin/Natron" "$@"
          EOF

          chmod +x ${PKG_NAME}/run-natron.sh
          chmod +x ${PKG_NAME}/bin/Natron* 2>/dev/null || true

          # F. Compress Tarball
          tar -czvf ${PKG_NAME}.tar.gz ${PKG_NAME}

      # ====================================================
      # 4. PUBLISH RELEASE TO GITHUB
      # ====================================================
      - name: Upload Universal Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-arm64-universal
          name: "Natron 2.6.0 Universal Linux ARM64"
          body: |
            ### Standalone Universal ARM64 Linux Package
            
            Distro-agnostic ARM64 build bundled with Qt 5.15, FFmpeg, Boost, Python, OpenColorIO, OpenFX-IO, OpenFX-Misc, and PyPlugs.

            #### Usage:
            ```bash
            tar -xzvf Natron-2.6.0-Universal-Linux-arm64.tar.gz
            cd Natron-2.6.0-Universal-Linux-arm64
            ./run-natron.sh
            ```
          draft: true
          files: Natron-2.6.0-Universal-Linux-arm64.tar.gz
