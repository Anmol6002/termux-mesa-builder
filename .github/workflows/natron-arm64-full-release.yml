name: Build Natron ARM64 (With Plugins & Releases)

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    name: Build Natron on Linux (Native ARM64)
    # Uses GitHub's native ARM64 Ubuntu runner
    runs-on: ubuntu-24.04-arm64
    
    steps:
      # Step 1: Clone Natron Core Engine
      - name: Checkout Source & Plugins
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/Natron'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 2: Grab the official Community PyPlugs Bundle
      - name: Fetch Community PyPlugs
        uses: actions/checkout@v4
        with:
          repository: 'NatronGitHub/natron-plugins'
          path: 'community-pyplugs'

      # Step 3: Install dependencies directly on the native host
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git cmake build-essential libx11-dev libxext-dev libgl1-mesa-dev \
            qtbase5-dev qtmultimedia5-dev libqt5svg5-dev libboost-all-dev \
            libcairo2-dev libopencolorio-dev libopenimageio-dev expat libexpat1-dev \
            fontconfig libfontconfig1-dev libpixman-1-dev zip

      # Step 4: Compile natively at full hardware speed
      - name: Build Linux ARM64 Binary & Plugins
        run: |
          mkdir build_linux && cd build_linux
          cmake -DCMAKE_BUILD_TYPE=Release -DAUDIO=ON -DRICHTEXT=ON -DBUNDLE_FONTS_CONF=ON ..
          cmake --build . --parallel $(nproc)
          cd ..

      # Step 5: Package the binaries and plugins
      - name: Package Release Assets
        run: |
          mkdir -p dist/linux-arm64/Plugins/PyPlugs
          # Use 'find' or explicit paths if your build setup copies binaries to a specific folder
          if [ -d "build_linux/bin" ]; then
            cp -r build_linux/bin/* dist/linux-arm64/
          else
            echo "Warning: build_linux/bin not found. Adjusting copy path..."
            cp build_linux/Natron dist/linux-arm64/ || true
          fi
          
          # Copy PyPlugs contents safely
          cp -r community-pyplugs/* dist/linux-arm64/Plugins/PyPlugs/
          
          # Compress everything
          cd dist
          zip -r ../natron-linux-arm64.zip linux-arm64/

      # Step 6: Automate the GitHub Release Creation
      - name: Generate Draft Release with Compilation Zip Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6.0-arm64-custom
          name: "Natron Full ARM64 Linux Build Suite"
          body: "Automated custom ARM64 Linux binaries for Natron with PyPlugs, Audio, and RichText parity flags active."
          draft: true 
          files: natron-linux-arm64.zip          
          
