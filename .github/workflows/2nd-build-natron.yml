name: Build Official Natron Ubuntu 22.04 (ARM64)

on:
  workflow_dispatch:

jobs:
  build-arm64-deb:
    runs-on: ubuntu-22.04-arm  # Ubuntu 22.04 ARM64 Runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Ubuntu 22.04 Official List)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libboost-serialization-dev libboost-system-dev \
            libexpat1-dev libcairo2-dev qt5-qmake qtbase5-dev python3-dev \
            libshiboken2-dev libpyside2-dev python3-pyside2.qtwidgets python3-qtpy \
            cmake git pkg-config wget curl \
            qtdeclarative5-dev qtmultimedia5-dev libqt5svg5-dev libqt5opengl5-dev qttools5-dev \
            libgl1-mesa-dev libglu1-mesa-dev libopencolorio-dev libopenimageio-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            libopenexr-dev libraw-dev libheif-dev librsvg2-dev libpango1.0-dev \
            libglew-dev libcmocka-dev libfftw3-dev libcurl4-openssl-dev \
            libmagick++-dev libpoppler-glib-dev libzip-dev liblcms2-dev libsox-dev libxml2-dev \
            libwebp-dev libcdr-dev librevenge-dev

      - name: Build Natron Engine (Strictly following INSTALL_LINUX.md)
        run: |
          PKG_DIR="$(pwd)/pkg_natron"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/OFX/Plugins"
          mkdir -p "${PKG_DIR}/usr/share/Natron/Plugins/PyPlugs"
          mkdir -p "${PKG_DIR}/usr/share/OpenColorIO-Configs"

          # 1. Get Natron & Submodules
          git clone -b RB-2.5 https://github.com/NatronGitHub/Natron && cd Natron
          git submodule update --init --recursive

          # Patch ARM64 signal context in AppManager.cpp for Linux ARM64
          sed -i 's/uc->uc_mcontext.gregs\[REG_EIP\]/uc->uc_mcontext.pc/g' Engine/AppManager.cpp
          sed -i 's/uc->uc_mcontext.gregs\[REG_RIP\]/uc->uc_mcontext.pc/g' Engine/AppManager.cpp

          # 2. Download OpenColorIO-Configs (INSTALL_LINUX.md)
          wget https://github.com/NatronGitHub/OpenColorIO-Configs/archive/Natron-v2.5.tar.gz
          tar xzf Natron-v2.5.tar.gz
          mv OpenColorIO-Configs-Natron-v2.5 OpenColorIO-Configs
          rm Natron-v2.5.tar.gz

          # 3. Build inside build-Natron directory
          cd ..
          mkdir build-Natron && cd build-Natron
          cmake -DCMAKE_INSTALL_PREFIX="/usr" ../Natron
          make -j$(nproc)
          DESTDIR="${PKG_DIR}" make install
          cd ..

          # 4. Explicit fail-safe copy for OpenColorIO-Configs
          cp -r Natron/OpenColorIO-Configs/* "${PKG_DIR}/usr/share/OpenColorIO-Configs/" 2>/dev/null || true

      - name: Build OpenFX Plugins & Community Plugins
        run: |
          PKG_DIR="$(pwd)/pkg_natron"

          # 1. Build openfx-io
          git clone --recursive https://github.com/NatronGitHub/openfx-io.git
          cd openfx-io
          find . -name "Makefile.master" -exec sed -i 's/-m64//g' {} +
          make CONFIG=release ARCHFLAGS= -j$(nproc)
          find . -type d -name "*.bundle" -exec cp -r {} "${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 2. Build openfx-misc
          git clone --recursive https://github.com/NatronGitHub/openfx-misc.git
          cd openfx-misc
          find . -name "Makefile.master" -exec sed -i 's/-m64//g' {} +
          make CONFIG=release ARCHFLAGS= CXXFLAGS_ADD=-fopenmp LDFLAGS_ADD=-fopenmp -j$(nproc)
          find . -type d -name "*.bundle" -exec cp -r {} "${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 3. Build openfx-arena
          git clone --recursive https://github.com/NatronGitHub/openfx-arena.git
          cd openfx-arena
          find . -name "Makefile.master" -exec sed -i 's/-m64//g' {} +
          make CONFIG=release ARCHFLAGS= AUDIO=ON -j$(nproc)
          find . -type d -name "*.bundle" -exec cp -r {} "${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 4. Build openfx-gmic
          git clone --recursive https://github.com/NatronGitHub/openfx-gmic.git
          cd openfx-gmic
          find . -name "Makefile.master" -exec sed -i 's/-m64//g' {} +
          make CONFIG=release ARCHFLAGS= -j$(nproc)
          find . -type d -name "*.bundle" -exec cp -r {} "${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 5. Install Community Plugins (natron-plugins)
          git clone https://github.com/NatronGitHub/natron-plugins.git pyplugs
          cp -r pyplugs/* "${PKG_DIR}/usr/share/Natron/Plugins/PyPlugs/"

          SHADERTOY_PRESETS_DIR=$(find "${PKG_DIR}/usr/OFX/Plugins" -type d -name "Shadertoy.ofx.bundle" -exec echo "{}/Contents/Resources/presets/default" \;)
          if [ -n "$SHADERTOY_PRESETS_DIR" ] && [ -d "pyplugs/Shadertoy" ]; then
            mkdir -p "$SHADERTOY_PRESETS_DIR"
            cp -r pyplugs/Shadertoy/* "$SHADERTOY_PRESETS_DIR/"
          fi

      - name: Package DEB
        run: |
          PKG_DIR="$(pwd)/pkg_natron"

          cat << 'EOF' > "${PKG_DIR}/DEBIAN/control"
          Package: natron
          Version: 2.5.0
          Architecture: arm64
          Maintainer: Natron Community <natron@github.com>
          Depends: libqt5widgets5, libqt5gui5, libqt5core5a, libqt5opengl5, libgl1-mesa-dri, libgl1-mesa-glx, libglu1-mesa, python3, python3-pyside2.qtwidgets, python3-qtpy, libopencolorio-dev, libopenimageio-dev, libfftw3-dev
          Section: graphics
          Priority: optional
          Description: Complete Natron Compositing Suite built according to official Ubuntu 22.04 specs (ARM64)
          EOF

          cat << 'EOF' > "${PKG_DIR}/usr/bin/natron-run"
          #!/bin/sh
          if [ -z "$LIBGL_ALWAYS_SOFTWARE" ]; then
          export LIBGL_ALWAYS_SOFTWARE=1
          fi
          exec /usr/bin/Natron "$@"
          EOF
          chmod +x "${PKG_DIR}/usr/bin/natron-run"

          dpkg-deb --build "${PKG_DIR}" natron_2.5.0_arm64.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natron-full-arm64-deb
          path: natron_2.5.0_arm64.deb
