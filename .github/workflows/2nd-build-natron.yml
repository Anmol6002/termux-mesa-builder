name: Build Natron Full ARM64 DEB Installer

on:
  workflow_dispatch:

jobs:
  build-arm64-deb:
    runs-on: ubuntu-22.04-arm  # Native ARM64 GitHub Runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git pkg-config wget \
            qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libqt5svg5-dev \
            libqt5opengl5-dev qttools5-dev qttools5-dev-tools qt5-qmake \
            libboost-dev libboost-serialization-dev libboost-filesystem-dev libboost-system-dev \
            libcairo2-dev libexpat1-dev libgl1-mesa-dev libglu1-mesa-dev \
            python3-dev python3-pip pyside2-tools libshiboken2-dev libpyside2-dev \
            python3-pyside2.qtwidgets python3-qtpy \
            libopencolorio-dev libopenimageio-dev \
            libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
            libopenexr-dev libraw-dev libheif-dev librsvg2-dev libpango1.0-dev \
            libglew-dev libcmocka-dev libfftw3-dev libcurl4-openssl-dev \
            libmagick++-dev libpoppler-glib-dev libzip-dev liblcms2-dev libsox-dev libxml2-dev

      - name: Build Natron Core Engine
        run: |
          # 1. Clone STABLE branch (RB-2.5) of Natron
          git clone -b RB-2.5 --recursive https://github.com/NatronGitHub/Natron.git natron-src
          cd natron-src

          # 2. Download & Extract OpenColorIO-Configs (Mandatory for Color Spaces)
          wget https://github.com/NatronGitHub/OpenColorIO-Configs/archive/Natron-v2.5.tar.gz
          tar xzf Natron-v2.5.tar.gz
          mv OpenColorIO-Configs-Natron-v2.5 OpenColorIO-Configs
          rm Natron-v2.5.tar.gz

          # 3. Build Core Natron Binary
          mkdir -p build && cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release ..
          ninja App/Natron
          cd ../..

      - name: Build All OpenFX Plugins & Package DEB
        run: |
          # Construct Debian Package Directory Structure
          PKG_DIR="pkg_natron"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/lib/natron"
          mkdir -p "${PKG_DIR}/usr/OFX/Plugins"
          mkdir -p "${PKG_DIR}/usr/share/Natron/PyPlugs"

          # Copy core executable
          cp natron-src/build/App/Natron "${PKG_DIR}/usr/lib/natron/Natron"

          # 1. Build openfx-io
          git clone --recursive https://github.com/NatronGitHub/openfx-io.git
          cd openfx-io
          make CONFIG=release -j$(nproc) || true
          find . -type d -name "*.bundle" -exec cp -r {} "../${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 2. Build openfx-misc
          git clone --recursive https://github.com/NatronGitHub/openfx-misc.git
          cd openfx-misc
          make CONFIG=release CXXFLAGS_ADD=-fopenmp LDFLAGS_ADD=-fopenmp -j$(nproc) || true
          find . -type d -name "*.bundle" -exec cp -r {} "../${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 3. Build openfx-arena
          git clone --recursive https://github.com/NatronGitHub/openfx-arena.git
          cd openfx-arena
          make CONFIG=release AUDIO=ON -j$(nproc) || true
          find . -type d -name "*.bundle" -exec cp -r {} "../${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 4. Build openfx-gmic
          git clone --recursive https://github.com/NatronGitHub/openfx-gmic.git
          cd openfx-gmic
          make CONFIG=release -j$(nproc) || true
          find . -type d -name "*.bundle" -exec cp -r {} "../${PKG_DIR}/usr/OFX/Plugins/" \;
          cd ..

          # 5. Install PyPlugs & GLSL Presets
          git clone https://github.com/NatronGitHub/natron-plugins.git pyplugs
          cp -r pyplugs/* "${PKG_DIR}/usr/share/Natron/PyPlugs/"

          SHADERTOY_PRESETS_DIR=$(find "${PKG_DIR}/usr/OFX/Plugins" -type d -name "Shadertoy.ofx.bundle" -exec echo "{}/Contents/Resources/presets/default" \;)
          if [ -n "$SHADERTOY_PRESETS_DIR" ] && [ -d "pyplugs/Shadertoy" ]; then
            mkdir -p "$SHADERTOY_PRESETS_DIR"
            cp -r pyplugs/Shadertoy/* "$SHADERTOY_PRESETS_DIR/"
          fi

          # 6. Write DEBIAN Control File
          cat << 'EOF' > "${PKG_DIR}/DEBIAN/control"
          Package: natron
          Version: 2.5.0
          Architecture: arm64
          Maintainer: Natron Community <natron@github.com>
          Depends: libqt5widgets5, libqt5gui5, libqt5core5a, libqt5opengl5, libgl1-mesa-dri, libgl1-mesa-glx, libglu1-mesa, python3, python3-pyside2.qtwidgets, python3-qtpy, libopencolorio2.1, libopenimageio2.2, libfftw3-3, libmagick++-6.q16-8, libpoppler-glib8, libzip4, liblcms2-2, libsox3
          Section: graphics
          Priority: optional
          Description: Complete Natron Compositing Suite with OCIO Configs & All Plugins (ARM64)
          EOF

          # 7. Write /usr/bin/natron Launcher Script
          cat << 'EOF' > "${PKG_DIR}/usr/bin/natron"
          #!/bin/sh
          if [ -z "$LIBGL_ALWAYS_SOFTWARE" ]; then
          export LIBGL_ALWAYS_SOFTWARE=1
          fi
          exec /usr/lib/natron/Natron "$@"
          EOF
          chmod +x "${PKG_DIR}/usr/bin/natron"

          # 8. Build Final .deb Package
          dpkg-deb --build "${PKG_DIR}" natron_2.5.0_arm64.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natron-full-arm64-deb
          path: natron_2.5.0_arm64.deb
