name: Build Natron ARM64 DEB

on:
  workflow_dispatch:  # Allows manual start from the Actions tab

jobs:
  build-arm64-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Build Natron ARM64 DEB
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          setup: |
            mkdir -p "${PWD}/artifacts"
          run: |
            # 1. Update system & Install build dependencies
            apt-get update
            apt-get install -y \
              build-essential cmake ninja-build git pkg-config \
              qtbase5-dev qtdeclarative5-dev qtmultimedia5-dev libqt5svg5-dev \
              libqt5opengl5-dev qttools5-dev qttools5-dev-tools \
              libboost-dev libboost-serialization-dev libboost-filesystem-dev libboost-system-dev \
              libcairo2-dev libexpat1-dev libgl1-mesa-dev libglu1-mesa-dev \
              python3-dev python3-pip pyside2-tools libshiboken2-dev libpyside2-dev \
              libopencolorio-dev libopenimageio-dev \
              libavcodec-dev libavformat-dev libswscale-dev libavutil-dev \
              libglew-dev libcmocka-dev

            # 2. Clone Natron repository directly into the runner
            git clone --recursive https://github.com/NatronGitHub/Natron.git natron-src
            cd natron-src

            # 3. Build Natron binary
            mkdir -p build && cd build
            cmake -GNinja -DCMAKE_BUILD_TYPE=Release ..
            ninja App/Natron
            cd ../..

            # 4. Create Debian Package Directory Layout
            PKG_DIR="pkg_natron"
            mkdir -p "${PKG_DIR}/DEBIAN"
            mkdir -p "${PKG_DIR}/usr/bin"
            mkdir -p "${PKG_DIR}/usr/lib/natron"

            # Copy compiled binary
            cp natron-src/build/App/Natron "${PKG_DIR}/usr/lib/natron/Natron"

            # Create DEBIAN/control file
            cat << 'EOF' > "${PKG_DIR}/DEBIAN/control"
            Package: natron
            Version: 2.5.0
            Architecture: arm64
            Maintainer: Natron Community <natron@github.com>
            Depends: libqt5widgets5, libqt5gui5, libqt5core5a, libqt5opengl5, libgl1-mesa-dri, libgl1-mesa-glx, libglu1-mesa, python3, libopencolorio2.1, libopenimageio2.2
            Section: graphics
            Priority: optional
            Description: Open-source node-based compositing software for Linux ARM64
            EOF

            # Create /usr/bin/natron launcher script
            cat << 'EOF' > "${PKG_DIR}/usr/bin/natron"
            #!/bin/sh
            if [ -z "$LIBGL_ALWAYS_SOFTWARE" ]; then
            export LIBGL_ALWAYS_SOFTWARE=1
            fi
            exec /usr/lib/natron/Natron "$@"
            EOF
            chmod +x "${PKG_DIR}/usr/bin/natron"

            # 5. Package as .deb
            dpkg-deb --build "${PKG_DIR}" artifacts/natron_2.5.0_arm64.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: natron-deb-installer
          path: artifacts/natron_2.5.0_arm64.deb
